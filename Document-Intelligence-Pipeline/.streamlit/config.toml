[theme]
base = "light"
primaryColor = "#3B5BDB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5FB"
textColor = "#1F2433"
linkColor = "#3B5BDB"
borderColor = "#D9DEEA"

greenColor = "#1a7f37"
orangeColor = "#bf8700"
redColor = "#cf222e"

baseRadius = "12px"
buttonRadius = "12px"
